# Auto-merged by `docker compose up` (only) alongside docker-compose.yml — no
# extra flags needed. It bind-mounts each service's source into its container
# and runs it in hot-reload/watch mode, so editing a file locally shows up
# without rebuilding or restarting anything.
#
# To run the plain, production-built images instead (no dev overrides), be
# explicit about which file(s) to use: `docker compose -f docker-compose.yml up`.

services:
  ai-core-backend:
    volumes:
      - ./ai-core-backend/src:/app/src
    # --reload watches the mounted src/ and restarts the app (not the
    # container) on change; uvicorn[standard] already bundles watchfiles.
    command:
      [
        "uvicorn",
        "ai_core_backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]

  frontend:
    build:
      context: ./admin-panel
      target: dev
    # `!override` (not the default merge behavior) because Compose otherwise
    # concatenates `ports` lists across files rather than replacing them —
    # this service would end up bound to both the base file's 80 and this
    # file's 5173, both published to the same host port, which fails outright.
    ports: !override
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      # Inside the container "localhost" is the frontend container itself, so
      # the dev proxy (vite.config.ts) needs the ai-core-backend service name instead.
      - VITE_DEV_API_PROXY_TARGET=http://ai-core-backend:8000
    volumes:
      - ./admin-panel:/app
      # Anonymous volume so the image's own node_modules (installed at build
      # time, with the right native bindings) isn't shadowed by the bind mount
      # above — which would otherwise hide it behind the host's node_modules
      # (or nothing, if it hasn't been npm-installed on the host at all).
      - /app/node_modules
