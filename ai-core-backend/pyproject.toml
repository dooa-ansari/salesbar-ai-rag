[project]
name = "ai-core-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dooa-ansari", email = "dooaansari@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "neo4j>=6.3.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
ai-core-backend = "ai_core_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
